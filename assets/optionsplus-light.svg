<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="opt opd"><title id="opt">Why Logi Options+ cannot keep the layout right on a KVM</title><desc id="opd">Two eighteen-second timelines over the same four KVM switches. On the first, with only Logi Options+ installed, a single setHostPlatform write happens when its agent starts; from the first KVM switch onwards the strip is red for the rest of the run, because Options+ only acts at start-up and a KVM switch starts nothing. On the second, with logiswitch running, each switch turns the strip red for 1.1 seconds and then green again. Measured on Logi Options+ 2.6.941708 for macOS by decompiling its agent and instrumenting the running process.</desc><style><![CDATA[@keyframes opsweep{from{transform:translateX(0);opacity:.85}to{transform:translateX(932px);opacity:.85}}.ophead{animation:opsweep 18s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><marker id="oparrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker></defs><rect width="1280" height="500" rx="18" fill="#ffffff"/><rect x=".5" y=".5" width="1279" height="499" rx="17.5" fill="none" stroke="#d1d9e0"/><text x="48" y="56" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1.0">Logi Options+ enforces the layout once, when its agent starts</text><text x="48" y="84" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" opacity="1.0">A KVM switch does not restart anything, so nothing re-asserts. Measured on Options+ 2.6.941708 for macOS: decompiled, then instrumented while running.</text><line x1="507.1" y1="136" x2="507.1" y2="342" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="714.2" y1="136" x2="714.2" y2="342" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="921.3" y1="136" x2="921.3" y2="342" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="1128.4" y1="136" x2="1128.4" y2="342" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 5"/><text x="48" y="148" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1.0">Logi Options+ only</text><text x="48" y="170" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">one write, at start</text><clipPath id="opsA"><rect x="300" y="136" width="932" height="26" rx="13"/></clipPath><g clip-path="url(#opsA)"><rect x="300" y="136" width="932" height="26" fill="#eaeef2"/><rect x="300.0" y="136" width="207.1" height="26" fill="#1a7f37"/><rect x="507.1" y="136" width="724.9" height="26" fill="#cf222e"/></g><line x1="351.8" y1="120" x2="351.8" y2="176" stroke="#0969da" stroke-width="2"/><text x="351.77777777777777" y="112" fill="#0969da" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="middle" opacity="1.0">agent start — setHostPlatform</text><text x="869.5555555555555" y="155" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="1.0">wrong layout, and nothing comes to fix it</text><text x="48" y="246" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1.0">KVM switch</text><line x1="300" y1="240" x2="1232" y2="240" stroke="#d1d9e0" stroke-width="1.5"/><line x1="507.1" y1="222" x2="507.1" y2="258" stroke="#1f2328" stroke-width="2.5" opacity="0.75"/><text x="507.1111111111111" y="214" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">switch 1</text><line x1="714.2" y1="222" x2="714.2" y2="258" stroke="#1f2328" stroke-width="2.5" opacity="0.75"/><text x="714.2222222222222" y="214" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">switch 2</text><line x1="921.3" y1="222" x2="921.3" y2="258" stroke="#1f2328" stroke-width="2.5" opacity="0.75"/><text x="921.3333333333333" y="214" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">switch 3</text><line x1="1128.4" y1="222" x2="1128.4" y2="258" stroke="#1f2328" stroke-width="2.5" opacity="0.75"/><text x="1128.4444444444443" y="214" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">switch 4</text><text x="48" y="328" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1.0">With logiswitch</text><text x="48" y="350" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">corrects every arrival</text><clipPath id="opsB"><rect x="300" y="316" width="932" height="26" rx="13"/></clipPath><g clip-path="url(#opsB)"><rect x="300" y="316" width="932" height="26" fill="#eaeef2"/><rect x="300.0" y="316" width="207.1" height="26" fill="#1a7f37"/><rect x="507.1" y="316" width="57.0" height="26" fill="#cf222e"/><rect x="564.1" y="316" width="150.2" height="26" fill="#1a7f37"/><rect x="714.2" y="316" width="57.0" height="26" fill="#cf222e"/><rect x="771.2" y="316" width="150.2" height="26" fill="#1a7f37"/><rect x="921.3" y="316" width="57.0" height="26" fill="#cf222e"/><rect x="978.3" y="316" width="150.2" height="26" fill="#1a7f37"/><rect x="1128.4" y="316" width="57.0" height="26" fill="#cf222e"/><rect x="1185.4" y="316" width="46.6" height="26" fill="#1a7f37"/></g><text x="535.5888888888888" y="308" fill="#cf222e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">1.1 s</text><text x="742.7" y="308" fill="#cf222e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">1.1 s</text><text x="949.8111111111111" y="308" fill="#cf222e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">1.1 s</text><text x="1156.9222222222224" y="308" fill="#cf222e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle" opacity="1.0">1.1 s</text><g class="ophead" opacity="0"><line x1="300" y1="118" x2="300" y2="356" stroke="#0969da" stroke-width="2"/><circle cx="300" cy="118" r="4.5" fill="#0969da"/></g><rect x="48" y="392" width="16" height="16" rx="4" fill="#1a7f37"/><text x="72" y="405" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" opacity="1.0">layout matches the machine</text><rect x="284" y="392" width="16" height="16" rx="4" fill="#cf222e"/><text x="308" y="405" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" opacity="1.0">Cmd and Option swapped</text><text x="48" y="456" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" opacity="1.0">Forcing the platform wrong underneath a running Options+ changed nothing for 45 s, window open or closed. Restarting its agent corrected it every time — which a KVM switch never does.</text></svg>
