<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img" aria-labelledby="arbt arbd"><title id="arbt">How several machines share one keyboard without fighting over it</title><desc id="arbd">A Mac, a Windows PC and a Windows laptop each run the agent and each show a bar of how long since someone typed on them, against a 20 second threshold. The Mac is being typed on, so its bar stays near zero and it writes the platform; the other two are past the threshold and stand down. When typing moves to the PC, the Mac's bar grows past the threshold and it yields, and the PC's bar drops to zero and it takes over writing the platform to the one MX Keys S they share.</desc><style><![CDATA[@keyframes pkt{to{stroke-dashoffset:-52}}.p{animation:pkt 0.8s linear infinite}@keyframes ownMac{0.0000%{opacity:1}57.7778%{opacity:1}59.4444%{opacity:0}100.0000%{opacity:0}}.ownMac{animation:ownMac 18s linear infinite}@keyframes yieldMac{0.0000%{opacity:0}56.1111%{opacity:0}57.7778%{opacity:1}100.0000%{opacity:1}}.yieldMac{animation:yieldMac 18s linear infinite}@keyframes ownPC{0.0000%{opacity:0}44.4444%{opacity:0}46.1111%{opacity:1}100.0000%{opacity:1}}.ownPC{animation:ownPC 18s linear infinite}@keyframes yieldPC{0.0000%{opacity:1}46.1111%{opacity:1}47.7778%{opacity:0}100.0000%{opacity:0}}.yieldPC{animation:yieldPC 18s linear infinite}@keyframes flowMac{0.0000%{opacity:0}1.6667%{opacity:0}3.3333%{opacity:1}57.7778%{opacity:1}59.4444%{opacity:0}100.0000%{opacity:0}}.flowMac{animation:flowMac 18s linear infinite}@keyframes flowPC{0.0000%{opacity:0}46.1111%{opacity:0}47.7778%{opacity:1}98.8889%{opacity:1}100.0000%{opacity:0}}.flowPC{animation:flowPC 18s linear infinite}@keyframes barMac{0.0000%{width:10px;fill:#1a7f37}11.1111%{width:24px}22.2222%{width:12px}33.3333%{width:26px}44.4444%{width:14px;fill:#1a7f37}57.7778%{width:160px;fill:#1a7f37}59.7222%{fill:#59636e}72.2222%{width:320px;fill:#59636e}100.0000%{width:320px;fill:#59636e}}@keyframes barPC{0.0000%{width:320px;fill:#59636e}44.4444%{width:320px;fill:#59636e}46.1111%{width:12px;fill:#1a7f37}61.1111%{width:26px}77.7778%{width:13px}100.0000%{width:22px;fill:#1a7f37}}.bMac{animation:barMac 18s linear infinite}.bPC{animation:barPC 18s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><marker id="arbarrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker></defs><rect width="1280" height="450" rx="18" fill="#ffffff"/><rect x=".5" y=".5" width="1279" height="449" rx="17.5" fill="none" stroke="#d1d9e0"/><text x="48" y="56" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1.0">Several machines, one keyboard: whoever is typing keeps it</text><text x="48" y="84" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" opacity="1.0">No configuration, no negotiation — the machines have no channel between them. Each just asks its own OS how long since anyone typed.</text><rect x="48" y="120" width="368" height="150" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><g transform="translate(72,142) scale(0.8333)"><path d="M16.365 1.43c0 1.14-.467 2.24-1.23 3.04-.82.86-2.15 1.52-3.26 1.43-.13-1.1.42-2.271.17-3.02.83-.85 2.27-1.47 3.32-1.45zM20.6 17.02c-.6 1.36-.89 1.97-1.66 3.17-1.081.68-2.6 3.77-4.48 3.79-1.68.01-2.11-1.09-4.38-1.08-2.27.01-2.75 1.1-4.42 1.09-1.88-.02-3.32-1.91-4.4-3.59C-1.7 15.7-2 9.68.44 6.5c1.13-1.5 2.9-2.44 4.57-2.44 1.7 0 2.77 1.09 4.36 1.09 1.55 0 2.49-1.09 4.46-1.09 1.5 0 3.09.82 4.22 2.23-3.71 2.03-3.11 7.33.55 8.73z" fill="#1f2328"/></g><text x="106" y="162" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1.0">Mac</text><line x1="48" y1="186" x2="416" y2="186" stroke="#d1d9e0"/><text x="72" y="212" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">idle time</text><rect x="72" y="224" width="320" height="10" rx="5" fill="#d1d9e0"/><rect x="72" y="224" width="320" height="10" rx="5" fill="#59636e" class="bMac"/><line x1="232" y1="219" x2="232" y2="239" stroke="#1f2328" stroke-width="1.5" opacity="0.55"/><text x="232" y="213" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0">20 s</text><g class="ownMac" opacity="0"><text x="72" y="256" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" opacity="1.0">typing now — it owns the keyboard</text><text x="392" y="162" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" opacity="1.0">writes platform 1</text></g><g class="yieldMac" opacity="1"><text x="72" y="256" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" opacity="1.0">idle past 20 s — standing down</text><text x="392" y="162" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" opacity="1.0">not writing</text></g><rect x="456" y="120" width="368" height="150" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><g transform="translate(480,142) scale(0.8333)"><path d="M0 3.45 10.35 2.05 10.35 11.6 0 11.6z M11.6 1.85 24 0 24 11.5 11.6 11.5z M0 12.85 10.35 12.85 10.35 22.4 0 21z M11.6 12.95 24 12.95 24 24 11.6 22.2z" fill="#1f2328"/></g><text x="514" y="162" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1.0">Windows PC</text><line x1="456" y1="186" x2="824" y2="186" stroke="#d1d9e0"/><text x="480" y="212" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">idle time</text><rect x="480" y="224" width="320" height="10" rx="5" fill="#d1d9e0"/><rect x="480" y="224" width="320" height="10" rx="5" fill="#59636e" class="bPC"/><line x1="640" y1="219" x2="640" y2="239" stroke="#1f2328" stroke-width="1.5" opacity="0.55"/><text x="640" y="213" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0">20 s</text><g class="ownPC" opacity="1"><text x="480" y="256" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" opacity="1.0">typing now — it owns the keyboard</text><text x="800" y="162" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" opacity="1.0">writes platform 0</text></g><g class="yieldPC" opacity="0"><text x="480" y="256" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" opacity="1.0">idle past 20 s — standing down</text><text x="800" y="162" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" opacity="1.0">not writing</text></g><rect x="864" y="120" width="368" height="150" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><g transform="translate(888,142) scale(0.8333)"><path d="M0 3.45 10.35 2.05 10.35 11.6 0 11.6z M11.6 1.85 24 0 24 11.5 11.6 11.5z M0 12.85 10.35 12.85 10.35 22.4 0 21z M11.6 12.95 24 12.95 24 24 11.6 22.2z" fill="#1f2328"/></g><text x="922" y="162" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1.0">Windows laptop</text><line x1="864" y1="186" x2="1232" y2="186" stroke="#d1d9e0"/><text x="888" y="212" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">idle time</text><rect x="888" y="224" width="320" height="10" rx="5" fill="#d1d9e0"/><rect x="888" y="224" width="320" height="10" rx="5" fill="#59636e"/><line x1="1048" y1="219" x2="1048" y2="239" stroke="#1f2328" stroke-width="1.5" opacity="0.55"/><text x="1048" y="213" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0">20 s</text><g><text x="888" y="256" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" opacity="1.0">idle past 20 s — standing down</text><text x="1208" y="162" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" opacity="1.0">not writing</text></g><path d="M 232 270 C 232 320 380 376 496 376" fill="none" stroke="#d1d9e0" stroke-width="1.4"/><g class="flowMac" opacity="0"><path d="M 232 270 C 232 320 380 376 496 376" fill="none" stroke="#0969da" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="12 40" class="p"/></g><path d="M 640 270 L 640 344" fill="none" stroke="#d1d9e0" stroke-width="1.4"/><g class="flowPC" opacity="0"><path d="M 640 270 L 640 344" fill="none" stroke="#0969da" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="12 40" class="p"/></g><path d="M 1048 270 C 1048 320 900 376 784 376" fill="none" stroke="#d1d9e0" stroke-width="1.4"/><rect x="496" y="344" width="288" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="640" y="372" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" opacity="1.0">MX Keys S</text><text x="640" y="392" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="middle" opacity="1.0">one platform slot</text><text x="640" y="434" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" opacity="1.0">Only one machine can be receiving your keystrokes, so each reaches the same answer on its own — for any number of machines.</text></svg>
