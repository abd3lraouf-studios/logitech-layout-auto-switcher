<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 252" width="940" height="252" role="img" aria-labelledby="latt latd"><title id="latt">How long an Easy-Switch return stays on the wrong layout</title><desc id="latd">Three bars on a log scale. Before the fix the worst case was the 600 second safety heartbeat; version 2.0.1 saw the reconnect but its backoff had already reached 32 seconds; version 2.0.2 believes the device when it announces itself and recovers in 1.1 seconds.</desc><style><![CDATA[@keyframes latb0{0.0000%{width:0px}2.2222%{width:0px}10.0000%{width:640.0px}100.0000%{width:640.0px}}.latb0{animation:latb0 18s linear infinite}@keyframes latb1{0.0000%{width:0px}6.6667%{width:0px}14.4444%{width:349.7px}100.0000%{width:349.7px}}.latb1{animation:latb1 18s linear infinite}@keyframes latb2{0.0000%{width:0px}11.1111%{width:0px}18.8889%{width:74.2px}100.0000%{width:74.2px}}.latb2{animation:latb2 18s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}]]></style><defs><marker id="latarrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4493f8"/></marker></defs><rect width="940" height="252" rx="18" fill="#0d1117"/><rect x=".5" y=".5" width="939" height="251" rx="17.5" fill="none" stroke="#3d444d"/><g transform="translate(24,22)"><text x="0" y="18" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" opacity="1.0">Time an Easy-Switch return stays on the wrong layout</text><text x="900" y="18" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="end" opacity="1.0">log scale</text><text x="0" y="66" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">before</text><rect x="72" y="46" width="640.0" height="26" rx="5" fill="#f85149" opacity="0.85" class="latb0"/><text x="724.0" y="64" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">600 s</text><text x="72" y="90" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">worst case: the 600 s safety heartbeat</text><text x="0" y="118" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">v2.0.1</text><rect x="72" y="98" width="349.7" height="26" rx="5" fill="#9198a1" opacity="0.85" class="latb1"/><text x="433.72753584707084" y="116" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">32 s</text><text x="72" y="142" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">reconnect seen, but the backoff was already at 30 s</text><text x="0" y="170" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">v2.0.2</text><rect x="72" y="150" width="74.2" height="26" rx="5" fill="#3fb950" opacity="0.85" class="latb2"/><text x="158.21002665193618" y="168" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">1.1 s</text><text x="72" y="194" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">the device announces itself and is believed</text></g></svg>
