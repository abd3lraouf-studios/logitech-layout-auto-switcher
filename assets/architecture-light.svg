<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 248" width="904" height="248" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/></marker></defs><g transform="translate(2,2)"><text x="0" y="18" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" opacity="1.0">Every thread sits in a kernel wait until hardware moves</text><rect x="0" y="38" width="250" height="78" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="20" y="64" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">watcher thread</text><text x="20" y="84" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">IOKit / cfgmgr32</text><text x="20" y="102" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">device arrived / left</text><rect x="0" y="132" width="250" height="78" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="20" y="158" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">reader thread × handle</text><text x="20" y="178" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">blocked in hid_read</text><text x="20" y="196" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">unsolicited frame = back</text><rect x="340" y="85" width="190" height="78" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text x="360" y="111" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">event queue</text><text x="360" y="131" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">coalesced, bounded</text><text x="360" y="149" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">never blocks a reader</text><rect x="620" y="85" width="280" height="78" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="640" y="111" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" opacity="1.0">worker thread</text><text x="640" y="131" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">read platform → write if wrong</text><text x="640" y="149" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" opacity="1.0">one cached read in the common case</text><line x1="258" y1="77" x2="332" y2="100" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/><line x1="258" y1="171" x2="332" y2="148" stroke="#59636e" stroke-width="1.75" marker-end="url(#head)"/><line x1="538" y1="124" x2="612" y2="124" stroke="#0969da" stroke-width="1.75" marker-end="url(#head)"/><text x="450" y="232" fill="#59636e" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="middle" opacity="1.0">handles are closed only after their readers are joined</text></g></svg>
