# Run the same checks CI runs, before the commit rather than after.
#   pip install pre-commit && pre-commit install
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # The press kit SVGs in art/ are shipped as exported; do not rewrite them.
        exclude: ^art/.*\.svg$
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
        # install.ps1 is intentionally CRLF; see .gitattributes.
        exclude: \.ps1$
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^logiswitch/
        additional_dependencies: [types-setuptools]
