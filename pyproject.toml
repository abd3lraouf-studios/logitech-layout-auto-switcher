[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logitech-layout-auto-switcher"
version = "2.7.0"
description = "Automatically switch a Logitech keyboard between Mac and Windows layouts when a KVM, Easy-Switch channel or cable moves it to another computer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Abdelraouf Sabri" }]
keywords = [
    "logitech", "mx-keys", "mx-mechanical", "mx-master", "hidpp", "hid",
    "kvm", "easy-switch", "keyboard-layout", "macos", "windows", "bolt", "unifying",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-timeout>=2.2",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
logiswitch = "logiswitch.cli:main"

[project.urls]
Homepage = "https://github.com/abd3lraouf-studios/logitech-layout-auto-switcher"
Issues = "https://github.com/abd3lraouf-studios/logitech-layout-auto-switcher/issues"
Documentation = "https://github.com/abd3lraouf-studios/logitech-layout-auto-switcher#readme"

[tool.setuptools.packages.find]
include = ["logiswitch*"]

# The icon macOS notifications are posted with; logiswitch.notify._macapp renders it
# into the notifier app it builds, so the wheel has to carry it.
[tool.setuptools.package-data]
"logiswitch.notify" = ["icon.png"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are often requested purely for their side effects (installing the fake
# HID backend), and tests use throwaway lambdas and reach into private state.
"tests/*" = ["ARG001", "ARG002", "ARG005", "C408", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra surfaces skip/xfail reasons; the strict flags turn a typo in a marker or a
# stale config key into an error rather than a silently ignored line.
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
# This suite drives real threads. Without a ceiling a deadlock hangs CI until the
# job times out with no clue which test was responsible.
timeout = 120
timeout_method = "thread"
markers = [
    "slow: takes more than a second; still runs by default",
]

[tool.coverage.run]
branch = true
source = ["logiswitch"]
parallel = true
# Windows and macOS runners record different absolute paths; without this the
# combined report treats them as unrelated files and the merge is meaningless.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]
# Platform-specific ctypes watchers cannot both be imported on one machine; the
# CI matrix covers each on its own OS and the combined report reflects that.
omit = ["logiswitch/__main__.py"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
# The Windows watcher uses ctypes.WINFUNCTYPE / WinDLL, which typeshed marks as
# win32-only. Pinning the assumed platform lets a single pass type-check the
# whole tree from any host, including the Linux CI runner. The macOS watcher
# only uses cross-platform ctypes APIs, so it is covered either way.
platform = "win32"
