[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logitech-layout-auto-switcher"
version = "2.0.3"
description = "Automatically switch a Logitech keyboard between Mac and Windows layouts when a KVM, Easy-Switch channel or cable moves it to another computer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Abdelraouf Sabri" }]
keywords = [
    "logitech", "mx-keys", "mx-mechanical", "mx-master", "hidpp", "hid",
    "kvm", "easy-switch", "keyboard-layout", "macos", "windows", "bolt", "unifying",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
logiswitch = "logiswitch.cli:main"

[project.urls]
Homepage = "https://github.com/App-Builders-Gang/logitech-layout-auto-switcher"
Issues = "https://github.com/App-Builders-Gang/logitech-layout-auto-switcher/issues"
Documentation = "https://github.com/App-Builders-Gang/logitech-layout-auto-switcher#readme"

[tool.setuptools.packages.find]
include = ["logiswitch*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are often requested purely for their side effects (installing the fake
# HID backend), and tests use throwaway lambdas and reach into private state.
"tests/*" = ["ARG001", "ARG002", "ARG005", "C408", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
# The Windows watcher uses ctypes.WINFUNCTYPE / WinDLL, which typeshed marks as
# win32-only. Pinning the assumed platform lets a single pass type-check the
# whole tree from any host, including the Linux CI runner. The macOS watcher
# only uses cross-platform ctypes APIs, so it is covered either way.
platform = "win32"
