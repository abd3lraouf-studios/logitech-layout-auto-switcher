<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="termt termd"><title id="termt">Installing logiswitch and checking it</title><desc id="termd">A terminal transcript: the one-line install script puts the agent in place, it finds an MX Keys S on a Logi Bolt receiver and reports it already on macOS; logiswitch doctor then prints the host, the sharing state including turn-taking suspended while Logi Options+ is running, the device and its 0x4531 capability, and finishes with nothing wrong.</desc><rect width="1080" height="560" rx="14" fill="#0b0d12"></rect><rect x=".5" y=".5" width="1079" height="559" rx="13.5" fill="none" stroke="#2a3038"></rect><path d="M0 14 a14 14 0 0 1 14 -14 h1052 a14 14 0 0 1 14 14 v30 h-1080 z" fill="#151a22"></path><circle cx="26" cy="22" r="6" fill="#ff5f57"></circle><circle cx="46" cy="22" r="6" fill="#febc2e"></circle><circle cx="66" cy="22" r="6" fill="#28c840"></circle><text x="540.0" y="27" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" text-anchor="middle" opacity="1.0">logiswitch — install and check</text><g class="tl" style="animation-delay:0s"><text x="34.0" y="96.0" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" text-anchor="start" opacity="1.0">$</text><text x="54.0" y="96.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">curl -fsSL https://raw.githubusercontent.com/abd3lraouf-studios/logitech-layout-auto-switcher/main/install.sh | bash</text></g><g class="tl" style="animation-delay:0.9s"><text x="68.0" y="119.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">installed logiswitch 2.3.0</text></g><g class="tl" style="animation-delay:1.3s"><text x="68.0" y="142.0" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">agent running: com.abd3lraouf.logiswitch</text></g><g class="tl" style="animation-delay:1.9s"><text x="68.0" y="165.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">watching for device changes via iokit</text></g><g class="tl" style="animation-delay:2.3s"><text x="68.0" y="188.0" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">found MX Keys S on Logi Bolt receiver at index 5 via MULTIPLATFORM 0x4531</text></g><g class="tl" style="animation-delay:2.7s"><text x="68.0" y="211.0" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">MX Keys S already on macos</text></g><g class="tl" style="animation-delay:3.6s"><text x="34.0" y="234.0" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" text-anchor="start" opacity="1.0">$</text><text x="54.0" y="234.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">logiswitch doctor</text></g><g class="tl" style="animation-delay:4.4s"><text x="68.0" y="257.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">logiswitch 2.3.0 doctor</text></g><g class="tl" style="animation-delay:4.7s"><text x="68.0" y="280.0" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">target OS : macos</text></g><g class="tl" style="animation-delay:5s"><text x="68.0" y="303.0" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">agent     : installed, running</text></g><g class="tl" style="animation-delay:5.6s"><text x="68.0" y="326.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">sharing</text></g><g class="tl" style="animation-delay:5.9s"><text x="84.26" y="349.0" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">this machine : Abdelraoufs-MacBook-Pro.local</text></g><g class="tl" style="animation-delay:6.2s"><text x="84.26" y="372.0" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">input        : in use now</text></g><g class="tl" style="animation-delay:6.5s"><text x="84.26" y="395.0" fill="#d29922" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">taking turns : SUSPENDED while logioptionsplus_agent is running here</text></g><g class="tl" style="animation-delay:7.1s"><text x="68.0" y="418.0" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">devices</text></g><g class="tl" style="animation-delay:7.4s"><text x="84.26" y="441.0" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">Logi Bolt receiver  (046D:C548)</text></g><g class="tl" style="animation-delay:7.7s"><text x="100.52000000000001" y="464.0" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">device index 5: MX Keys S (HID++ 4.5)</text></g><g class="tl" style="animation-delay:8s"><text x="116.78" y="487.0" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">capability: MULTIPLATFORM 0x4531</text></g><g class="tl" style="animation-delay:8.6s"><text x="68.0" y="510.0" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" text-anchor="start" opacity="1.0">Nothing is wrong at this moment.</text></g></svg>