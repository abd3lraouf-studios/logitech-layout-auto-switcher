name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Make a UnicodeEncodeError in a log line fail loudly rather than by platform.
  PYTHONIOENCODING: "utf-8"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff mypy
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check --diff .
      - name: Type check
        run: mypy logiswitch
      - name: README assets are in sync with their generator
        run: python tools/make_assets.py --check

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # macos-latest runners are arm64 and have no 3.9 build; Windows still
          # supports the version the project claims, so keep it covered there.
          - os: windows-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report= --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: CLI smoke test
        # A runner has no Logitech hardware, so "nothing found" is the correct
        # outcome; this only proves the entry point imports, parses and exits sanely.
        run: |
          python -m logiswitch --version
          python -m logiswitch status || true
          python -m logiswitch probe || true

      - name: Stamp the coverage data with this matrix entry
        # pytest-cov combines its parallel files at the end of the run, leaving a
        # single `.coverage`. Every job would upload that same name, so give each
        # one a suffix `coverage combine` will still recognise.
        shell: bash
        run: mv .coverage ".coverage.${{ matrix.os }}.${{ matrix.python-version }}"

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit-*.xml
          if-no-files-found: ignore
          retention-days: 5

  installer:
    # Issue #9: install.ps1 broke under Windows PowerShell 5.1 and nothing ran it.
    # Exercise both the checkout path and the piped one-liner path, under 5.1
    # (`powershell`) and 7 (`pwsh`), each followed by its uninstall.
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # The one-liner downloads the ref it is given; test the commit under test.
      LOGISWITCH_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Shell and interpreters
        run: |
          "PowerShell $($PSVersionTable.PSVersion)"
          $ErrorActionPreference = 'Continue'
          py -0p
          $global:LASTEXITCODE = 0

      - name: Install from the checkout
        run: |
          # Capture only Write-Host (stream 6). Redirecting stderr too would make
          # Windows PowerShell 5.1 turn pip's first stderr line into a terminating
          # error, and would hide the real one from this log.
          .\install.ps1 6>&1 | Tee-Object -FilePath install-output.txt
          $out = Get-Content -Raw install-output.txt
          if (-not ($out -match 'Installed\.')) { throw 'installer did not finish' }
          # The venv must sit on a Python hidapi ships wheels for, even when the
          # runner also has a newer one (py -3 alone would pick that).
          $minor = [int](.\.venv\Scripts\python.exe -c 'import sys; print(sys.version_info[1])')
          if ($minor -gt 14) { throw "venv is on Python 3.$minor, which hidapi has no wheel for" }
          "venv: Python 3.$minor"

      - name: The logon task is registered
        run: |
          .\.venv\Scripts\python.exe -m logiswitch service-status
          schtasks /Query /TN LogiSwitch
          if ($LASTEXITCODE -ne 0) { throw 'scheduled task missing' }

      - name: Uninstall from the checkout
        run: |
          .\install.ps1 -Uninstall
          # A missing task makes schtasks write to stderr; under 5.1 with 'Stop'
          # that redirected stderr would itself abort the step.
          $ErrorActionPreference = 'Continue'
          schtasks /Query /TN LogiSwitch *> $null
          if ($LASTEXITCODE -eq 0) { throw 'scheduled task still registered' }
          $global:LASTEXITCODE = 0

      - name: One-liner install
        env:
          LOGISWITCH_HOME: ${{ runner.temp }}\logiswitch-oneliner
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:LOGISWITCH_HOME\venv\Scripts\python.exe")) { throw 'no venv' }
          schtasks /Query /TN LogiSwitch
          if ($LASTEXITCODE -ne 0) { throw 'scheduled task missing' }

      - name: One-liner uninstall
        env:
          LOGISWITCH_HOME: ${{ runner.temp }}\logiswitch-oneliner
          LOGISWITCH_UNINSTALL: "1"
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          if (Test-Path $env:LOGISWITCH_HOME) { throw 'install dir left behind' }
          # A missing task makes schtasks write to stderr; under 5.1 with 'Stop'
          # that redirected stderr would itself abort the step.
          $ErrorActionPreference = 'Continue'
          schtasks /Query /TN LogiSwitch *> $null
          if ($LASTEXITCODE -eq 0) { throw 'scheduled task still registered' }
          $global:LASTEXITCODE = 0

  coverage:
    name: combined coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install coverage[toml]

      - name: Collect coverage from every matrix job
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine
        # Paths differ between the Windows and macOS runners; --keep is not needed
        # but relative_files (set in pyproject) is what makes the merge line up.
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Enforce the floor
        # Windows-only and macOS-only code (the two ctypes watchers, the two service
        # backends) is each covered by exactly one half of the matrix, so only the
        # combined report is meaningful. The floor sits just below where the suite
        # actually measures (84% with branch coverage): it exists to catch coverage
        # falling off a cliff, not to be ratcheted up one line at a time.
        run: coverage report --fail-under=82

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 5

  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/logiswitch --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5
