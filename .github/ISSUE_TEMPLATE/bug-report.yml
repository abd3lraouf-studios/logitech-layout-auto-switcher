name: Bug report
description: Something does not work
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Paste the last ~100 lines of the agent's log, from around when it went wrong:
        macOS `~/Library/Logs/logiswitch.log`, Windows `%LOCALAPPDATA%\LogiSwitch\logiswitch.log`.
        Better still, run `logiswitch bundle` and drag the zip it writes into the
        "Anything else" box below: it collects the logs, the crash file, the doctor
        report and the service definition in one go.
        Please do not start a second agent with `logiswitch watch` while the installed
        one is running; the two fight over the keyboard.
      render: text
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: logiswitch probe output
      render: text

  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true

  - type: dropdown
    id: options
    attributes:
      label: Is Logi Options+ installed and running?
      options: ["Yes", "No", "Not sure"]
    validations:
      required: true

  - type: input
    id: kvm
    attributes:
      label: KVM model, if any

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >-
        Attach the zip from `logiswitch bundle` here (drag it into this box). It holds
        your hostname and log lines; look it over first if that matters to you.
